<div class="page">
  <div class="page-header">
    <div>
      <h1>Categorías</h1>
      <p class="subtitle">Organiza tus transacciones por categoría</p>
    </div>
    <a routerLink="create" class="btn btn-primary">Nueva categoría</a>
  </div>

  <div class="alert alert-error" *ngIf="error">{{ error }}</div>

  <table class="table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of categories">
        <td>{{ c.name }}</td>
        <td>{{ c.description }}</td>
        <td>
          <span
            class="badge"
            [class.active]="c.isActive === 1"
            >{{ c.isActive === 1 ? 'Activa' : 'Inactiva' }}</span
          >
        </td>
        <td class="text-right">
          <button class="btn btn-sm" (click)="toggleStatus(c, c.isActive !== 1)">
            {{ c.isActive === 1 ? 'Desactivar' : 'Activar' }}
          </button>
          <button class="btn btn-sm btn-danger" (click)="remove(c)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="loading" class="loading-text">Cargando...</p>
  <p *ngIf="categories.length === 0 && !error && !loading" class="empty-text">
    No hay categorías registradas.
  </p>
</div>
